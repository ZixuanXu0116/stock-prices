name: fetch-prices

on:
  schedule:
    # 每 30 分钟一次，UTC 13:00–22:59 的工作日。
    # 这个区间同时覆盖夏令时（盘中 13:30–20:00 UTC）和冬令时（14:30–21:00 UTC）。
    # ⚠️ 2026-09-10 实测：GitHub 对定时任务限流严重——9/8 起每天 20 个排程实际只跑 3 个，
    # 且整点/半点（:00/:30）是全平台最挤的时刻，最容易被整批丢弃。
    # 所以分钟改用冷门的 17/47，并另加下面的 push 触发作为保底（push 触发不受定时限流影响）。
    - cron: "17,47 13-22 * * 1-5"
  push:
    branches: [main]
    paths: [".fetch-request"]   # 交易机器人发现价格过期时，推这个文件强制抓一轮
  workflow_dispatch:        # 允许手动触发，方便配置时验证

permissions:
  contents: write           # 需要写权限才能把 prices.json 提交回仓库

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取报价
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: python3 fetch_prices.py

      - name: 提交
        run: |
          git config user.name  "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)" || echo "无变化，跳过"
          # 机器人可能刚写过 ledger.json，先合并再推，避免撞车
          git pull --rebase --autostash origin main || true
          git push
